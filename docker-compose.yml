version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ghcr.io/prince364133/offmesh-backend:latest
    container_name: offmesh-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://offmesh:offmesh_secret_password@postgres:5432/offmesh
      - REDIS_URL=redis://redis:6379
      - MERKLE_BUCKET_MINUTES=5
      - MERKLE_SWEEP_INTERVAL_MINUTES=15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - offmesh-network

  postgres:
    image: postgres:16-alpine
    container_name: offmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: offmesh
      POSTGRES_PASSWORD: offmesh_secret_password
      POSTGRES_DB: offmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offmesh -d offmesh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - offmesh-network

  redis:
    image: redis:7-alpine
    container_name: offmesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - offmesh-network

networks:
  offmesh-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
